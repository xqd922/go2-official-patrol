# 站点参数：只写与仓库默认值不同的现场差异。
# apply_site.sh 会据此生成 <站点>/nav2_params.yaml 与 <站点>/site.env（两个都是生成文件）。
name: demo

# 接机器狗的网卡名；留空 = 自动取默认路由网卡。
# 现场多网卡（WiFi + 有线直连狗）时务必写死，例如 enp3s0 / eth0。
iface: ""

# 机器狗地址（官方默认 192.168.123.161）
dog_ip: 192.168.123.161

# 固定起点：机器狗每次上电时所处位置在 map 坐标系下的位姿（米 / 弧度）。
# 无人工干预开机自启巡检的关键，写错会导致 AMCL 定位发散、Nav2 不动作。
initial_pose:
  x: 0.0
  y: 0.0
  yaw: 0.0

# 覆盖 Nav2 里的机器人半径（米），按实际机身 + 防护罩留余量
robot_radius: 0.35

# 生产机没有显示器，保持 false；现场调试可临时改 true 看 RViz
rviz: false

# 巡检任务参数（对应 patrol_manager 的节点参数）
patrol:
  loops: 1                 # 巡检圈数
  return_home: true        # 巡检结束回 home 点
  battery_low: 20.0        # 低电量保护阈值（%）
  arrival_tolerance: 0.30  # 到点判定半径（米）

# 额外注入到 site.env 的环境变量（一般留空）
# env:
#   ROS_DOMAIN_ID: 0
