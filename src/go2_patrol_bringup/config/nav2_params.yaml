amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    set_initial_pose: false
    min_particles: 300
    max_particles: 1000

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # 不要在这里写 default_nav_to_pose_bt_xml: ""
    # 空串不是"用默认值"，而是"加载空文件"→ 行为树抛 Empty Tree，所有导航目标必然失败。
    # 不写这一行，bt_navigator 才用自带的 navigate_to_pose_w_replanning_and_recovery.xml。

map_server:
  ros__parameters:
    use_sim_time: false
    # 占位值：nav2_bringup 的 map:=<站点地图> 会在启动时改写这一行。
    # 这一行必须存在（RewrittenYaml 只改写已存在的键），否则 map_server 起不来。
    yaml_filename: ""

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    # Humble 的这两个参数是 string 数组，写成标量会让 controller_server 直接加载失败
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      use_costregulation: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.35
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.4
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.15
          raytrace_max_range: 6.0
          raytrace_min_range: 0.15
      # 插件列表里写了的插件，这里必须给出 plugin 参数，否则 costmap 配置阶段直接 FATAL
      # （曾经少了 inflation_layer 配置，Nav2 一启动就整栈崩溃）
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.35
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.15
          raytrace_max_range: 6.0
          raytrace_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
